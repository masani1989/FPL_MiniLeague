services:
  - type: web
    name: fpl-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVarGroups:
      - name: fpl-backend-secrets
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FPL_LEAGUE_ID
        value: "581588"
      - key: SEASON_ID
        value: "2026-27"
    healthCheckPath: /health
